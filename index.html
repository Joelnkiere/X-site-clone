<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accueil - X Clone</title>
    <link rel="stylesheet" href="css/main.css">
</head>

<body>
    <section class="conteneur-application">
        <aside class="barre-laterale">
            <nav class="menu-navigation">
                <header class="logo-navigation">
                    <h1>X</h1>
                </header>
                <ul class="liste-navigation">
                    <li class="element-navigation">
                        <a href="index.html" class="lien-navigation actif">Accueil</a>
                    </li>
                    <li class="element-navigation">
                        <a href="profile.html" class="lien-navigation">Profil</a>
                    </li>
                    <li class="element-navigation">
                        <a href="#" id="logoutLink" class="lien-navigation">Déconnexion</a>
                    </li>
                </ul>
            </nav>
        </aside>

        <main class="contenu-principal">
            <header class="en-tete-timeline">
                <h2>Accueil</h2>
            </header>

            <section class="section-formulaire-tweet">
                <form class="formulaire-tweet" id="formulaireTweet">
                    <section class="contenu-formulaire-tweet">
                        <section class="avatar-formulaire-tweet">
                            <img src="images/joel.jpg" alt="Votre avatar" class="avatar">
                        </section>
                        <section class="champs-formulaire-tweet">
                            <textarea id="contenuTweet" class="zone-texte-tweet" placeholder="Quoi de neuf ?"
                                maxlength="280" rows="4"></textarea>
                            <footer class="pied-formulaire-tweet">
                                <span class="compteur-caracteres">
                                    <span id="compteurCaracteres">0</span>/280
                                </span>
                                <button type="submit" class="bouton-tweeter">Tweeter</button>
                            </footer>
                        </section>
                    </section>
                </form>
            </section>

            <section class="timeline">
                <!-- Les tweets seront chargés dynamiquement ici -->
            </section>
        </main>
    </section>
    <script src="js/auth.js"></script>
    <script src="js/tweets.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Protection de la route - vérifier si l'utilisateur est connecté
        document.addEventListener('DOMContentLoaded', function () {
            if (!AuthService.isAuthenticated()) {
                window.location.href = 'login.html';
            }

            // Gérer la déconnexion
            const logoutLink = document.getElementById('logoutLink');
            if (logoutLink) {
                logoutLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    AuthService.logout();
                });
            }
        });
    </script>
</body>

</html>
