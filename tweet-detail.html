        <!-- Contenu principal -->
        <main class="contenu-principal">
            <header class="en-tete-timeline" style="display: flex; align-items: center; gap: 16px; padding: 8px 16px;">
                <a href="index.html" class="lien-retour" title="Retour">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                        <path d="M7.414 13l5.043 5.04-1.414 1.42L3.586 12l7.457-7.46 1.414 1.42L7.414 11H21v2H7.414z">
                        </path>
                    </svg>
                </a>
                <h2 style="margin: 0; font-size: 20px;">Post</h2>
            </header>

            <article class="carte-tweet-principal">
                <!-- Le tweet sera chargé dynamiquement ici -->
            </article>

            <section class="section-reponses">
                <header class="en-tete-reponses">
                    <h3>Réponses</h3>
                </header>
                <!-- Les réponses seront chargées dynamiquement ici -->
            </section>

            <section class="section-formulaire-reponse">
                <form class="formulaire-tweet" id="formulaireReponse">
                    <section class="contenu-formulaire-tweet">
                        <section class="avatar-formulaire-tweet">
                            <img src="images/user-avatar.png" alt="Votre avatar" class="avatar" id="avatarReponse">
                        </section>
                        <section class="champs-formulaire-tweet">
                            <textarea id="contenuReponse" class="zone-texte-tweet" placeholder="Postez votre réponse"
                                maxlength="280" rows="2"></textarea>
                            <footer class="pied-formulaire-tweet">
                                <section class="options-tweet">
                                    <button type="button" class="option-tweet" title="Média">
                                        <svg viewBox="0 0 24 24">
                                            <path
                                                d="M3 5.5C3 4.119 4.119 3 5.5 3h13C19.881 3 21 4.119 21 5.5v13c0 1.381-1.119 2.5-2.5 2.5h-13C4.119 21 3 19.881 3 18.5v-13zM5.5 5c-.276 0-.5.224-.5.5v9.086l3-3 3 3 5-5 3 3V5.5c0-.276-.224-.5-.5-.5h-13z">
                                            </path>
                                        </svg>
                                    </button>
                                    <button type="button" class="option-tweet" title="Emoji">
                                        <svg viewBox="0 0 24 24">
                                            <path
                                                d="M8 9.5C8 8.119 8.672 7 9.5 7S11 8.119 11 9.5 10.328 12 9.5 12 8 10.881 8 9.5zm6.5 2.5c.828 0 1.5-1.119 1.5-2.5S15.328 7 14.5 7 13 8.119 13 9.5s.672 2.5 1.5 2.5zM12 16c-2.224 0-3.021-2.227-3.051-2.316l-1.897.633c.05.15 1.271 3.684 4.949 3.684s4.898-3.533 4.949-3.684l-1.896-.638c-.033.095-.83 2.322-3.053 2.322z">
                                            </path>
                                        </svg>
                                    </button>
                                </section>
                                <section style="display: flex; align-items: center; gap: 12px;">
                                    <span class="compteur-caracteres">
                                        <span id="compteurCaracteres">0</span>/280
                                    </span>
                                    <button type="submit" class="bouton-tweeter" disabled>Répondre</button>
                                </section>
                            </footer>
                        </section>
                    </section>
                </form>
            </section>
        </main>

        <!-- Panneau droit -->
        <aside class="panneau-droit">
            <section class="recherche-container">

                    <p class="tendance-sujet">#JavaScript</p>
                    <p class="tendance-tweets">12.5K posts</p>
                </article>
                <article class="tendance">
                    <p class="tendance-categorie">Tendance</p>
                    <p class="tendance-sujet">#WebDev</p>
                    <p class="tendance-tweets">8.7K posts</p>
                </article>
                <a href="#" class="voir-plus-tendances">Voir plus</a>
            </section>

    <script src="js/auth.js"></script>
    <script src="js/tweets.js"></script>
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            if (typeof isAuthenticated !== 'function') return;

            if (!isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            const currentUser = getCurrentUser();
            if (currentUser) {
                const avatarReponse = document.getElementById('avatarReponse');
                if (avatarReponse) {
                    avatarReponse.src = currentUser.profilePicture || 'images/user-avatar.png';
                }
            }

            const logoutLink = document.getElementById('logoutLink');
            if (logoutLink) {
                logoutLink.addEventListener('click', function (e) {
                    e.preventDefault();
                    logout();
                });
            }
        });
    </script>
